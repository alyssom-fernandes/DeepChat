<!DOCTYPE html>
<html lang="pt-BR" data-tema="escuro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Os dois scripts e o estilo desta página entram na CSP pelo hash (sha256 do
     conteúdo exato). Mudou um deles, o hash muda: tests/csp.test.mjs aponta qual. -->
<meta http-equiv="Content-Security-Policy"
  content="default-src 'none';
           script-src 'sha256-RWXME0uRjVVPQNvGmOO9Yg0MXOHQVTQomrHpCT1PC+w=' 'sha256-j0VrvT/u3nbn7XwDIdbeUXeLsBoxDhsKGiapRbzqSvk=';
           style-src 'sha256-MsqpVVh3a8/l7gI7VJCcCgWxdDn5bF/jPGyThRBihys=';
           font-src 'self';
           img-src data:;
           base-uri 'none';
           form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>Página não encontrada · DeepChat</title>
<meta name="color-scheme" content="dark light">
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23141416'/%3E%3Ccircle cx='12.5' cy='16' r='7.5' fill='none' stroke='%238ea2ff' stroke-width='2.6'/%3E%3Ccircle cx='19.5' cy='16' r='7.5' fill='none' stroke='%2345d3a2' stroke-width='2.6'/%3E%3C/svg%3E">
<!-- Página própria para endereço que não existe (o GitHub Pages usa o 404.html
     da raiz). Segue o tema escolhido no DeepChat e, sem escolha, o do aparelho. -->
<script>
  (function () {
    var t = null;
    try { t = localStorage.getItem('dc_tema'); } catch (e) {}
    if (t !== 'claro' && t !== 'escuro') t = window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches ? 'claro' : 'escuro';
    document.documentElement.setAttribute('data-tema', t);
    // As fontes do próprio site. A 404 aparece em qualquer caminho: no GitHub
    // Pages o app fica em /DeepChat/; num servidor local, na raiz.
    var base = /\.github\.io$/.test(location.hostname) ? '/DeepChat/fonts/' : '/fonts/';
    try {
      [['Instrument Sans', 'instrument-sans-latin.woff2', { weight: '400 700', stretch: '85% 100%' }],
       ['JetBrains Mono', 'jetbrains-mono-latin.woff2', { weight: '400 700' }]].forEach(function (f) {
        var fonte = new FontFace(f[0], 'url(' + base + f[1] + ') format("woff2")', f[2]);
        document.fonts.add(fonte);
        fonte.load().catch(function () {});
      });
    } catch (e) { /* sem FontFace: fica a fonte do sistema */ }
  })();
</script>
<style>
  :root { --fundo: #141416; --borda: #2a2a30; --texto: #ededef; --fraco: #a9a9b3; --apagado: #8a8a94; --tinta: #ededef; --sobre-tinta: #141416;
          --ds: #8ea2ff; --gpt: #45d3a2; --foco: #8ea2ff; --pf-afn: #c44a5a; --pf-sys: rgba(255,255,255,.32); color-scheme: dark; }
  [data-tema="claro"] { --fundo: #ffffff; --borda: #e5e5e9; --texto: #18181b; --fraco: #52525b; --apagado: #6b6b75; --tinta: #18181b; --sobre-tinta: #fff;
          --ds: #3651d4; --gpt: #08795a; --foco: #3651d4; --pf-afn: #6b1f2a; --pf-sys: #505050; color-scheme: light; }
  * { box-sizing: border-box; margin: 0; }
  body { min-height: 100vh; display: flex; flex-direction: column; background: var(--fundo); color: var(--texto);
         font-family: 'Instrument Sans', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  .logo { display: flex; align-items: center; gap: 10px; padding: 28px clamp(24px, 6vw, 88px) 0; font-size: 16px; font-weight: 650; }
  .logo svg { width: 26px; height: 26px; }
  .logo circle { fill: none; stroke-width: 2.4; }
  main { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 48px clamp(24px, 6vw, 88px); max-width: 760px; }
  .codigo { font-size: 14px; font-weight: 600; color: var(--apagado); margin-bottom: 16px; }
  h1 { font-size: clamp(34px, 7vw, 52px); font-weight: 650; font-stretch: 92%; letter-spacing: -.03em; line-height: 1.04; margin-bottom: 16px; }
  h1 span { color: var(--apagado); }
  p { font-size: 17px; line-height: 1.6; color: var(--fraco); margin-bottom: 32px; }
  .acoes { display: flex; flex-wrap: wrap; gap: 10px; }
  a.btn { display: inline-flex; align-items: center; height: 44px; padding: 0 18px; border-radius: 10px; font-size: 15px; font-weight: 600; text-decoration: none; }
  .pri { background: var(--tinta); color: var(--sobre-tinta); }
  .sec { border: 1px solid var(--borda); color: var(--texto); }
  a:focus-visible { outline: 2px solid var(--foco); outline-offset: 2px; }
  footer { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 16px 20px; border-top: 1px solid var(--borda);
           font-family: 'JetBrains Mono', monospace; font-weight: 700; }
  .pf-afn { font-size: 10px; letter-spacing: 2px; color: var(--pf-afn); }
  .pf-sys { font-size: 10px; letter-spacing: 2px; color: var(--pf-sys); margin-left: 4px; }
  .pf-pipe { font-size: 13px; color: var(--pf-sys); }
  .pf-info { font-size: 11px; letter-spacing: .3px; color: var(--pf-sys); }
</style>
</head>
<body>
  <div class="logo"><svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="12.5" cy="16" r="7.5" stroke="var(--ds)"/><circle cx="19.5" cy="16" r="7.5" stroke="var(--gpt)"/></svg>DeepChat</div>
  <main>
    <p class="codigo">Erro 404</p>
    <h1>Esta página não existe.<br><span>A conversa continua lá.</span></h1>
    <p>O endereço pode ter mudado ou ter sido digitado errado.</p>
    <div class="acoes">
      <a class="btn pri" id="inicio" href="/DeepChat/">Abrir o DeepChat</a>
      <a class="btn sec" id="demo" href="/DeepChat/?demo=1">Ver a demonstração</a>
    </div>
  </main>
  <footer aria-label="AFN Systems, DeepChat">
    <span><span class="pf-afn">AFN</span><span class="pf-sys">SYSTEMS</span></span>
    <span class="pf-pipe" aria-hidden="true">|</span>
    <span class="pf-info">DeepChat</span>
  </footer>
  <script>
    // No GitHub Pages o app fica em /DeepChat/; num servidor local, na raiz.
    if (!/\.github\.io$/.test(location.hostname)) {
      document.getElementById('inicio').href = '/';
      document.getElementById('demo').href = '/?demo=1';
    }
  </script>
</body>
</html>
